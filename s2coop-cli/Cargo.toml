[package]
name = "s2coop-cli"
version = "0.1.0"
edition = "2024"

[lib]
name = "s2coop_cli"
crate-type = ["rlib"]

[[bin]]
name = "s2coop-cli"
path = "src/main.rs"

[dependencies]
s2coop-analyzer = { workspace = true }
clap = "4.5"
csv = "1.3"
indicatif = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "1"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
